apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-lab
resources:
  - ../../kubernetes
images:
  - name: platform-lab-backend
    newName: docker.io/library/platform-lab-backend
    digest: sha256:2db7b4fef29ee83dfc0aa5e5bba919f306064829b0217a6a12875065072df8cc
  - name: platform-lab-frontend
    newName: docker.io/library/platform-lab-frontend
    digest: sha256:26df98226d67ae71a5d3623abeecb43fefd636c4fe5569ed00fe95d880861565
patches:
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: platform-lab
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-worker
        namespace: platform-lab
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: platform-lab-worker
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: platform-lab-worker
      $patch: delete
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        strategy:
          type: Recreate
  - target:
      kind: ConfigMap
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
