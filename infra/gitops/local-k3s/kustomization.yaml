apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-lab
resources:
  - ../../kubernetes
patches:
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: platform-lab
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-worker
        namespace: platform-lab
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: platform-lab-worker
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: platform-lab-worker
      $patch: delete
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        strategy:
          type: Recreate
  - target:
      kind: ConfigMap
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
