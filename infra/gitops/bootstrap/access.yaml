apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-gitops
  namespace: platform-lab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-gitops
  namespace: platform-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-gitops
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
---
# This registers a namespaced destination; it contains no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: platform-local-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: platform-local
  server: https://kubernetes.default.svc
  namespaces: platform-lab
  clusterResources: "false"
  config: "{}"
