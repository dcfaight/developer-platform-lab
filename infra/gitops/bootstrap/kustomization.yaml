apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes
  - access.yaml
  - application.yaml
patches:
  - target:
      group: apps
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: Service
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: ConfigMap
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: Ingress
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
      $patch: delete
