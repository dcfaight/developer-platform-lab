apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: platform-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: platform-lab-backend
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: deploy
            - name: PLATFORM_WORKER_ENABLED
              value: "true"
            - name: PLATFORM_KUBERNETES_MODE
              value: in-cluster
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: database-password
            - name: PLATFORM_SECURITY_USERS_0_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: operator-username
            - name: PLATFORM_SECURITY_USERS_0_PASSWORDHASH
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: operator-password-hash
            - name: PLATFORM_SECURITY_USERS_0_ROLES
              value: OPERATOR
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: worker-credentials
              mountPath: /var/run/secrets/platform-worker
              readOnly: true
      volumes:
        - name: worker-credentials
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
