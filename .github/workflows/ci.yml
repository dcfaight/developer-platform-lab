name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker availability for Testcontainers
        run: docker info
      - run: ./mvnw --batch-mode verify

  provisioning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: developer-platform-lab
          config: infra/kind/cluster.yaml
      - name: Exercise approved provisioning against real kind
        env:
          PLATFORM_KIND_TEST: 'true'
        run: ./mvnw --batch-mode -Dtest=KindProvisioningTests,KindWorkerFlowTests test

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s automation/tests -v
      - run: python -m compileall -q automation
      - name: Validate Compose configuration without starting services
        run: POSTGRES_PASSWORD="$(openssl rand -hex 16)" docker compose config --quiet
