spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: none

platform:
  worker:
    enabled: false
